<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caverna — Registro de Carga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0B0D;
    --panel: #16181B;
    --panel-2: #1D2023;
    --border: #2A2D30;
    --text: #E7E8EA;
    --text-dim: #7C8085;
    --accent: #E8B923;
    --accent-dim: #6B5A1E;
    --up: #6FCF97;
    --down: #C0392B;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 500px 260px at 50% -60px, rgba(232,185,35,0.10), transparent 70%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:20px 16px 60px;
    position:relative;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:18px;
  }
  header{position:relative;}
  .bat-mark{
    position:absolute;
    top:-16px;
    left:50%;
    transform:translateX(-50%);
    width:170px;
    height:90px;
    opacity:0.14;
    z-index:0;
    pointer-events:none;
  }
  .bat-mark svg{width:100%;height:100%;fill:var(--accent);}
  header > div, header > button{position:relative; z-index:1;}
  h1{
    font-family:'Bebas Neue',sans-serif;
    font-weight:400;
    font-size:34px;
    line-height:0.95;
    margin:0;
    letter-spacing:1px;
  }
  h1 span{color:var(--accent);}
  .subtitle{
    color:var(--text-dim);
    font-size:13px;
    margin-top:4px;
  }
  .quote{
    color:var(--accent);
    font-size:11.5px;
    font-style:italic;
    margin-top:8px;
    opacity:0.85;
    max-width:260px;
  }
  .json-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--text-dim);
    font-size:11px;
    padding:6px 10px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    margin-top:2px;
  }
  .json-btn:hover{border-color:var(--text-dim); color:var(--text);}

  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:14px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
  }
  .tab.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#1A1500;
    box-shadow:0 0 14px rgba(232,185,35,0.45);
  }

  .focus-line{
    color:var(--text-dim);
    font-size:13px;
    margin:0 0 14px 2px;
  }

  .exercise{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px;
    margin-bottom:8px;
  }
  .icon{
    flex:0 0 auto;
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--panel-2);
    border-radius:8px;
  }
  .icon svg{width:22px;height:22px;stroke:var(--text-dim);}
  .ex-info{flex:1 1 auto; min-width:0;}
  .ex-name{
    font-size:14.5px;
    font-weight:500;
    margin:0 0 2px;
  }
  .ex-sets{
    font-size:12px;
    color:var(--text-dim);
    margin:0;
  }
  .weight-box{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    cursor:pointer;
    min-width:58px;
  }
  .weight-val{
    font-family:'Oswald',sans-serif;
    font-size:22px;
    font-weight:600;
    color:var(--accent);
    line-height:1;
  }
  .weight-unit{
    font-size:10px;
    color:var(--text-dim);
  }
  .delta{
    font-size:11px;
    margin-top:2px;
  }
  .delta.up{color:var(--up);}
  .delta.down{color:var(--down);}
  .delta.flat{color:var(--text-dim);}

  .weight-input{
    width:58px;
    background:var(--panel-2);
    border:1px solid var(--accent);
    color:var(--text);
    font-family:'Oswald',sans-serif;
    font-size:18px;
    text-align:right;
    border-radius:6px;
    padding:2px 6px;
  }

  .section-title{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:600;
    color:var(--text-dim);
    margin:22px 0 10px 2px;
  }

  .cardio-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .cardio-card .icon{background:var(--panel-2);}
  .cardio-text .big{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:600;
  }
  .cardio-text .small{
    font-size:12px;
    color:var(--text-dim);
  }

  /* modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    width:100%;
    max-width:440px;
    max-height:85vh;
    display:flex;
    flex-direction:column;
    padding:16px;
  }
  .modal h2{
    font-family:'Oswald',sans-serif;
    font-size:16px;
    margin:0 0 8px;
  }
  .modal p.hint{
    font-size:12px;
    color:var(--text-dim);
    margin:0 0 10px;
  }
  .modal textarea{
    flex:1 1 auto;
    min-height:260px;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:monospace;
    font-size:12px;
    border-radius:8px;
    padding:10px;
    resize:vertical;
  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:12px;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:8px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    cursor:pointer;
  }
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#1A1500;
  }
  .error-msg{
    color:var(--down);
    font-size:12px;
    margin-top:8px;
    min-height:14px;
  }
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--panel-2);
    border:1px solid var(--accent);
    color:var(--text);
    padding:8px 16px;
    border-radius:20px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s;
    z-index:60;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>CAVERNA<span>.</span></h1>
      <div class="subtitle" id="focusHeader">Carregando...</div>
      <div class="quote">"Por que caímos? Para aprendermos a levantar."</div>
    </div>
    <button class="json-btn" id="openJson">Editar JSON</button>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="focus-line" id="focusLine"></div>

  <div id="exerciseList"></div>

  <div class="section-title">Abdômen (todo dia)</div>
  <div id="absList"></div>

  <div class="section-title">Cardio</div>
  <div class="cardio-card" id="cardioCard"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Editar plano (JSON)</h2>
    <p class="hint">Cole o JSON completo do plano e salve. As cargas (kg) ficam guardadas separadas, não somem se você trocar o plano.</p>
    <textarea id="jsonArea" spellcheck="false"></textarea>
    <div class="error-msg" id="jsonError"></div>
    <div class="modal-actions">
      <button class="btn" id="cancelJson">Cancelar</button>
      <button class="btn primary" id="saveJson">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ICONS = {
  chest: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3v8H4zM17 8h3v8h-3z"/><path d="M7 10h10v4H7z"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M6 7l6-4 6 4M6 12h12M6 17h12"/></svg>',
  shoulders: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="8" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M8.5 9.5L12 13l3.5-3.5M12 13v7"/></svg>',
  triceps: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v9a5 5 0 0010 0V4M9 20h6"/></svg>',
  biceps: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20c0-6 2-9 2-13a4 4 0 018 0c0 3-1 4-1 7"/><circle cx="16" cy="6" r="1.2" fill="currentColor" stroke="none"/></svg>',
  legs: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l1 8-2 10h-2l-1-8-1 8H8l-2-10z"/></svg>',
  abs: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="4" width="8" height="16" rx="2"/><path d="M8 9h8M8 14h8M12 4v16"/></svg>',
  cardio: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>'
};
function iconSvg(key){ return ICONS[key] || ICONS.chest; }

const DEFAULT_PLAN = {
  "days": [
    { "id":"push_a", "label":"Push A", "focus":"Peito / Ombro / Tríceps", "exercises":[
      {"id":"supino_reto_barra","name":"Supino reto barra","sets":4,"reps":"8-10","muscle":"chest"},
      {"id":"supino_inclinado_halteres","name":"Supino inclinado halteres","sets":3,"reps":"10-12","muscle":"chest"},
      {"id":"crucifixo","name":"Crucifixo (voador)","sets":3,"reps":"12-15","muscle":"chest"},
      {"id":"desenvolvimento_militar_halteres","name":"Desenvolvimento militar halteres","sets":3,"reps":"10","muscle":"shoulders"},
      {"id":"triceps_corda","name":"Tríceps corda","sets":3,"reps":"12","muscle":"triceps"}
    ]},
    { "id":"pull_a", "label":"Pull A", "focus":"Costas / Bíceps", "exercises":[
      {"id":"puxada_frente","name":"Puxada frente","sets":4,"reps":"10","muscle":"back"},
      {"id":"remada_baixa","name":"Remada baixa (cabo)","sets":3,"reps":"10","muscle":"back"},
      {"id":"remada_unilateral","name":"Remada unilateral halter","sets":3,"reps":"10 cada lado","muscle":"back"},
      {"id":"rosca_direta","name":"Rosca direta","sets":3,"reps":"12","muscle":"biceps"},
      {"id":"rosca_martelo","name":"Rosca martelo","sets":3,"reps":"12","muscle":"biceps"}
    ]},
    { "id":"legs_a", "label":"Legs A", "focus":"Pernas", "exercises":[
      {"id":"agachamento","name":"Agachamento livre/smith","sets":4,"reps":"8-10","muscle":"legs"},
      {"id":"leg_press","name":"Leg press","sets":3,"reps":"12","muscle":"legs"},
      {"id":"cadeira_extensora","name":"Cadeira extensora","sets":3,"reps":"15","muscle":"legs"},
      {"id":"mesa_flexora","name":"Mesa flexora","sets":3,"reps":"15","muscle":"legs"},
      {"id":"panturrilha_a","name":"Panturrilha","sets":4,"reps":"15","muscle":"legs"}
    ]},
    { "id":"push_b", "label":"Push B", "focus":"Peito (foco) / Ombro / Tríceps", "exercises":[
      {"id":"supino_inclinado_barra","name":"Supino inclinado barra","sets":4,"reps":"8-10","muscle":"chest"},
      {"id":"crossover","name":"Crossover ou peck deck","sets":3,"reps":"12-15","muscle":"chest"},
      {"id":"supino_reto_halteres","name":"Supino reto halteres","sets":3,"reps":"10","muscle":"chest"},
      {"id":"desenvolvimento_maquina","name":"Desenvolvimento máquina","sets":3,"reps":"10","muscle":"shoulders"},
      {"id":"triceps_testa","name":"Tríceps testa","sets":3,"reps":"12","muscle":"triceps"}
    ]},
    { "id":"pull_b", "label":"Pull B", "focus":"Costas / Bíceps", "exercises":[
      {"id":"barra_fixa","name":"Barra fixa ou puxada supinada","sets":4,"reps":"10","muscle":"back"},
      {"id":"remada_cavalinho","name":"Remada cavalinho","sets":3,"reps":"10","muscle":"back"},
      {"id":"pullover","name":"Pullover","sets":3,"reps":"12","muscle":"back"},
      {"id":"rosca_scott","name":"Rosca scott","sets":3,"reps":"12","muscle":"biceps"},
      {"id":"face_pull","name":"Face pull","sets":3,"reps":"15","muscle":"shoulders"}
    ]},
    { "id":"legs_b", "label":"Legs B", "focus":"Pernas (posterior)", "exercises":[
      {"id":"terra_romeno","name":"Levantamento terra romeno","sets":4,"reps":"8-10","muscle":"legs"},
      {"id":"afundo","name":"Afundo","sets":3,"reps":"10 cada"},
      {"id":"adutora_abdutora","name":"Cadeira adutora/abdutora","sets":3,"reps":"15","muscle":"legs"},
      {"id":"stiff_unilateral","name":"Stiff unilateral ou passada","sets":3,"reps":"10","muscle":"legs"},
      {"id":"panturrilha_b","name":"Panturrilha sentado","sets":4,"reps":"15","muscle":"legs"}
    ]}
  ],
  "abs": [
    {"id":"prancha","name":"Prancha","sets":3,"reps":"40-45s"},
    {"id":"elevacao_pernas","name":"Elevação de pernas","sets":3,"reps":"15"},
    {"id":"abdominal_infra","name":"Abdominal infra","sets":3,"reps":"15-20"}
  ],
  "cardio": { "minutes": 30, "note": "Esteira — ritmo constante ou intervalado (1min forte / 2min leve)" }
};

let plan = null;
let activeDayId = null;
let weightCache = {};

const $ = (sel) => document.querySelector(sel);
const toastEl = $('#toast');
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1600);
}

async function loadPlan(){
  try{
    const res = await window.storage.get('plan', false);
    plan = res ? JSON.parse(res.value) : DEFAULT_PLAN;
  }catch(e){
    plan = DEFAULT_PLAN;
    try{ await window.storage.set('plan', JSON.stringify(DEFAULT_PLAN), false); }catch(_){}
  }
}

async function getWeight(exId){
  if(weightCache[exId]) return weightCache[exId];
  try{
    const res = await window.storage.get('weight:'+exId, false);
    const data = res ? JSON.parse(res.value) : {current:null, history:[]};
    weightCache[exId] = data;
    return data;
  }catch(e){
    const data = {current:null, history:[]};
    weightCache[exId] = data;
    return data;
  }
}

async function setWeight(exId, kg){
  const data = await getWeight(exId);
  const today = new Date().toISOString().slice(0,10);
  const prev = data.current;
  data.history = data.history || [];
  data.history.push({date: today, kg: kg});
  if(data.history.length > 30) data.history = data.history.slice(-30);
  data.current = kg;
  weightCache[exId] = data;
  try{
    await window.storage.set('weight:'+exId, JSON.stringify(data), false);
  }catch(e){}
  return {prev, current: kg};
}

function deltaLabel(prev, current){
  if(prev === null || prev === undefined) return {text:'primeiro registro', cls:'flat'};
  const diff = current - prev;
  if(diff > 0) return {text:'▲ +'+diff+'kg', cls:'up'};
  if(diff < 0) return {text:'▼ '+diff+'kg', cls:'down'};
  return {text:'— igual', cls:'flat'};
}

function renderTabs(){
  const tabsEl = $('#tabs');
  tabsEl.innerHTML = '';
  plan.days.forEach(day => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (day.id === activeDayId ? ' active' : '');
    btn.textContent = day.label;
    btn.onclick = () => { activeDayId = day.id; renderAll(); };
    tabsEl.appendChild(btn);
  });
}

async function renderExerciseRow(ex){
  const data = await getWeight(ex.id);
  const row = document.createElement('div');
  row.className = 'exercise';

  const icon = document.createElement('div');
  icon.className = 'icon';
  icon.innerHTML = iconSvg(ex.muscle);
  row.appendChild(icon);

  const info = document.createElement('div');
  info.className = 'ex-info';
  info.innerHTML = `<p class="ex-name">${ex.name}</p><p class="ex-sets">${ex.sets}x ${ex.reps}</p>`;
  row.appendChild(info);

  const wbox = document.createElement('div');
  wbox.className = 'weight-box';

  function renderStatic(){
    wbox.innerHTML = '';
    const val = document.createElement('div');
    val.className = 'weight-val';
    val.textContent = (data.current !== null && data.current !== undefined) ? data.current : '—';
    const unit = document.createElement('div');
    unit.className = 'weight-unit';
    unit.textContent = 'kg';
    wbox.appendChild(val);
    wbox.appendChild(unit);
    if(data.history && data.history.length){
      const last = data.history[data.history.length-1];
      const prevEntry = data.history.length > 1 ? data.history[data.history.length-2].kg : null;
      const d = deltaLabel(prevEntry, last.kg);
      const delta = document.createElement('div');
      delta.className = 'delta ' + d.cls;
      delta.textContent = d.text;
      wbox.appendChild(delta);
    }
    wbox.onclick = renderEditing;
  }

  function renderEditing(){
    wbox.innerHTML = '';
    wbox.onclick = null;
    const input = document.createElement('input');
    input.type = 'number';
    input.step = '0.5';
    input.className = 'weight-input';
    input.value = data.current !== null && data.current !== undefined ? data.current : '';
    input.placeholder = 'kg';
    wbox.appendChild(input);
    input.focus();
    input.select();

    async function commit(){
      const v = parseFloat(input.value);
      if(!isNaN(v)){
        await setWeight(ex.id, v);
        showToast(ex.name + ' → ' + v + 'kg salvo');
      }
      renderStatic();
    }
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') input.blur(); });
    input.addEventListener('blur', commit);
  }

  renderStatic();
  row.appendChild(wbox);
  return row;
}

async function renderExercises(){
  const day = plan.days.find(d => d.id === activeDayId);
  $('#focusLine').textContent = day.focus;
  $('#focusHeader').textContent = day.label + ' · ' + day.focus;
  const list = $('#exerciseList');
  list.innerHTML = '';
  for(const ex of day.exercises){
    const row = await renderExerciseRow(ex);
    list.appendChild(row);
  }
}

async function renderAbs(){
  const list = $('#absList');
  list.innerHTML = '';
  for(const ex of plan.abs){
    const exWithIcon = Object.assign({muscle:'abs'}, ex);
    const row = await renderExerciseRow(exWithIcon);
    list.appendChild(row);
  }
}

function renderCardio(){
  const card = $('#cardioCard');
  card.innerHTML = `
    <div class="icon">${iconSvg('cardio')}</div>
    <div class="cardio-text">
      <div class="big">${plan.cardio.minutes} min de esteira</div>
      <div class="small">${plan.cardio.note}</div>
    </div>
  `;
}

async function renderAll(){
  renderTabs();
  await renderExercises();
  await renderAbs();
  renderCardio();
}

// JSON modal
const overlay = $('#overlay');
$('#openJson').onclick = () => {
  $('#jsonArea').value = JSON.stringify(plan, null, 2);
  $('#jsonError').textContent = '';
  overlay.classList.add('open');
};
$('#cancelJson').onclick = () => overlay.classList.remove('open');
$('#saveJson').onclick = async () => {
  const raw = $('#jsonArea').value;
  let parsed;
  try{
    parsed = JSON.parse(raw);
  }catch(e){
    $('#jsonError').textContent = 'JSON inválido: ' + e.message;
    return;
  }
  if(!parsed.days || !Array.isArray(parsed.days) || !parsed.days.length){
    $('#jsonError').textContent = 'JSON precisa ter um array "days" com pelo menos um dia.';
    return;
  }
  try{
    await window.storage.set('plan', JSON.stringify(parsed), false);
    plan = parsed;
    if(!plan.days.find(d => d.id === activeDayId)) activeDayId = plan.days[0].id;
    overlay.classList.remove('open');
    showToast('Plano atualizado');
    await renderAll();
  }catch(e){
    $('#jsonError').textContent = 'Erro ao salvar: ' + e.message;
  }
};
overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('open'); });

(async function init(){
  await loadPlan();
  activeDayId = plan.days[0].id;
  await renderAll();
})();
</script>
</body>
</html>
